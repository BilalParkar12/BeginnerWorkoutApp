name: Generate Environment and Build
on:
  push:
    branches: [ main ]

jobs:
  build-project:
    runs-index: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # This step creates the .env file dynamically right before building
      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}" >> .env

      - name: Install Dependencies
        run: npm install

      # Your Expo build commands go here (e.g., EAS Build)
